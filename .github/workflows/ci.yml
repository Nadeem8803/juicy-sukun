name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm run setup
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Firebase emulator integration tests (rules + callable functions)
        run: |
          npm i -g firebase-tools
          npm run test:integration
      - name: Browser tests (demo mode)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Full-stack browser test (real functions in emulators)
        run: npm run e2e:full

  apk:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - name: Add google-services.json (repository secret GOOGLE_SERVICES_JSON)
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
      - run: npm run apk
      - uses: actions/upload-artifact@v4
        with: { name: owner-app-debug, path: android/app/build/outputs/apk/debug/app-debug.apk }
